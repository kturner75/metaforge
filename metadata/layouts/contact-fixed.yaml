layout: ContactFixed
entity: Contact
description: Fixed-width contact record — one 73-character line per contact.

format:
  kind: fixed
  encoding: utf-8
  recordLength: 73

mapping:
  - field: firstName
    at: { offset: 0, width: 20 }
    required: true
    transform:
      - trim: {}

  - field: lastName
    at: { offset: 20, width: 20 }
    required: true
    transform:
      - trim: {}

  - field: email
    at: { offset: 40, width: 30 }
    transform:
      - trim: {}

  - field: status
    at: { offset: 70, width: 3 }
    transform:
      - trim: {}
      - lookup:
          map:
            A: active
            I: inactive
            L: lead
          default: lead
